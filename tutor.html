<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Math Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body class="tutor-page">
  <header>
    <h1>AI Math Tutor</h1>
    <p>Ask any math question or upload a photo of a problem.</p>
  </header>

  <main class="container">
    <div class="chat-box">
      <div id="chatBox" class="messages"></div>

      <div class="input-area">
        <input id="userInput" type="text" placeholder="Type your math question..." />
        <button onclick="sendMessage()">Send</button>
        <button onclick="openCamera()">📷</button>
        <input type="file" id="photoUpload" accept="image/*" onchange="uploadPhoto()" />
      </div>

      <video id="cameraStream" autoplay playsinline></video>
      <canvas id="cameraCapture"></canvas>

      <div style="margin-top:1rem; display:flex; gap:0.75rem; flex-wrap:wrap; align-items:center;">
        <button id="showWorkBtn" onclick="showWork()">✏️ Show Your Work</button>
        <button id="testBackendBtn" onclick="testBackend()">🔗 Test Backend</button>
      </div>
      <div id="backendStatus" style="margin-top:0.75rem; font-size:0.95rem; color:#4b5563;"></div>
      <div id="workOutput"></div>
    </div>
  </main>

  <script src="js/tutor.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
