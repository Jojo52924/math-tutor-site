<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Math Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="tutor-page">
  <div class="container tutor-layout">
    <aside class="sidebar">
      <h2>AI Math Tutor</h2>
      <div id="chatBox"></div>
    </aside>

    <main class="main">
      <h3>Solve Any Math Problem</h3>

      <input id="userInput" type="text" placeholder="Type your math question..." />

      <div class="buttons">
        <button onclick="sendMessage()">Ask AI</button>
        <button onclick="openCamera()">📷 Camera</button>
        <button onclick="document.getElementById('photoUpload').click()">📁 Upload</button>
      </div>

      <input type="file" id="photoUpload" accept="image/*" onchange="uploadPhoto()" hidden />

      <video id="cameraStream" autoplay playsinline></video>
      <canvas id="cameraCapture"></canvas>
    </main>
  </div>

  <script src="js/tutor.js"></script>
</body>
</html>
