<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Math Tutor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="tutor-page">
  <div class="tutor-container">

    <!-- Sidebar -->
    <aside class="tutor-sidebar">
      <h2 class="sidebar-title">AI Math Tutor</h2>
      <div id="chatBox" class="chat-box"></div>
    </aside>

    <!-- Main Content -->
    <main class="tutor-main">

      <!-- Modern Tutor Section -->
      <section class="tutor-hero">
        <h2 class="tutor-title">Ask Any Math Question</h2>
        <p class="tutor-sub">Choose AI or Offline Solver</p>
      </section>

      <div class="tutor-grid">

        <!-- AI Card -->
        <div class="tutor-card">
          <h3 class="card-title">AI Math Tutor</h3>
          <p class="card-sub">Smart explanations powered by AI</p>

          <input id="userInput" class="input-field" type="text" placeholder="Ask the AI tutor..." />

          <div class="button-row">
            <button class="btn primary" onclick="sendMessage()">Ask AI</button>
            <button class="btn" onclick="openCamera()">📷 Camera</button>
            <button class="btn" onclick="document.getElementById('photoUpload').click()">📁 Upload</button>
          </div>

          <input type="file" id="photoUpload" accept="image/*" onchange="uploadPhoto()" hidden />
        </div>

        <!-- Graph Explorer Card -->
        <section class="graph-section tutor-card graph-card">
          <h2>Graph Explorer</h2>

          <input id="graphInput" class="input-field" type="text" placeholder="Type a function or point" />
          <button type="button" onclick="graphInput()" class="btn primary">Plot Graph</button>
          <button type="button" onclick="resetGraph()" class="btn secondary">Reset</button>

          <div id="graphStatus" class="graph-status">Enter a function using x to see a graph.</div>
          <p id="calcResult"></p>
          <div class="graph-lock">
            <canvas id="graphCanvas" width="300" height="300"></canvas>
          </div>
        </section>

        <!-- Offline Solver Card -->
        <div class="tutor-card">
          <h3 class="card-title">Offline Math Solver</h3>
          <p class="card-sub">No API key needed — solves instantly</p>

          <input id="question" class="input-field" type="text" placeholder="Example: x^2 - 5x + 4 = 0" />

          <button class="btn primary full" onclick="askTutor()">Solve Offline</button>

          <div id="output" class="output-box"></div>
        </div>

      </div>

      <video id="cameraStream" autoplay playsinline class="camera-stream"></video>
      <canvas id="cameraCapture"></canvas>

    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/tutor.js"></script>
</body>
</html>
